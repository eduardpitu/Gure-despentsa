<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despentsa · Tu despensa, siempre al día</title>
<meta name="description" content="Controla lo que tienes en casa, recibe avisos cuando algo se acaba y comparte la lista de la compra con quien vives.">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despentsa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#FAF7F0; --ink:#1E2A22; --ink-2:#55615A; --ink-3:#8A948D;
    --line:#E7E0D0; --brand:#2F6B4F; --brand-ink:#FFFFFF; --brand-soft:#DDEBE1;
    --amber:#9A6516; --amber-soft:#FBEBC8; --red:#C2452D; --red-soft:#F8DDD5;
    --shadow:0 1px 2px rgba(30,42,34,.05),0 8px 24px rgba(30,42,34,.06);
    --radius:20px;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root[data-theme="auto"]{
      --bg:#131A15; --surface:#1C2520; --surface-2:#18201B; --ink:#EEF2EC; --ink-2:#B3BEB6; --ink-3:#7F8B83;
      --line:#2A352D; --brand:#5FB88A; --brand-ink:#0E1912; --brand-soft:#213A2C;
      --amber:#E8B04A; --amber-soft:#3A2F15; --red:#F08A73; --red-soft:#3E211B;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131A15; --surface:#1C2520; --surface-2:#18201B; --ink:#EEF2EC; --ink-2:#B3BEB6; --ink-3:#7F8B83;
    --line:#2A352D; --brand:#5FB88A; --brand-ink:#0E1912; --brand-soft:#213A2C;
    --amber:#E8B04A; --amber-soft:#3A2F15; --red:#F08A73; --red-soft:#3E211B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;}
  input,select,textarea{font:inherit;color:inherit;}
  h1,h2,h3,p{margin:0;}
  [hidden]{display:none !important;}
  :focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:10px;}
  .ic{width:22px;height:22px;flex:none;display:block;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- Layout ---------- */
  .app{max-width:720px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom));min-height:100dvh;}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-name{font:600 19px/1.1 var(--serif);letter-spacing:-.01em;}
  .hogar-name{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
  .syncpill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .syncpill i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);}
  .syncpill.ok i{background:#3FA56B;}
  .syncpill.sync i{background:var(--amber);animation:pulse 1s ease-in-out infinite;}
  .syncpill.err i{background:var(--red);}
  @keyframes pulse{50%{opacity:.35}}
  .page{padding-top:6px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px;}
  .page-head h1{font:600 28px/1.1 var(--serif);letter-spacing:-.015em;}
  .page-head .sub{font-size:13px;color:var(--ink-3);margin-top:4px;}

  /* ---------- Botones ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;
    background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px;transition:transform .08s,filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn.soft{background:var(--brand-soft);color:var(--brand);}
  .btn.danger{background:var(--red-soft);color:var(--red);}
  .btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px;}
  .btn.lg{min-height:54px;font-size:16.5px;width:100%;border-radius:16px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .link{color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px;}

  /* ---------- Resumen, filtros, búsqueda ---------- */
  .banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--radius);margin-bottom:14px;}
  .banner b{display:block;font-size:16px;}
  .banner span{font-size:13.5px;opacity:.85;}
  .banner.warn{background:var(--amber-soft);color:var(--amber);}
  .banner.warn .btn{background:var(--amber);color:var(--surface);}
  .banner.good{background:var(--brand-soft);color:var(--brand);}
  .banner .lead{display:flex;align-items:center;gap:12px;}
  .banner .lead .ic{width:26px;height:26px;}
  .search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:50px;margin-bottom:12px;color:var(--ink-3);}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);}
  .search input{flex:1;border:0;background:none;outline:0;height:100%;color:var(--ink);min-width:0;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink-2);}
  .chip em{font-style:normal;font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums;}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip.out em,.chip.low em{opacity:1;font-weight:700;}
  .chip.out:not([aria-pressed="true"]) em{color:var(--red);}
  .chip.low:not([aria-pressed="true"]) em{color:var(--amber);}

  /* ---------- Categorías y filas ---------- */
  .cat{margin-top:18px;}
  .cat-head{display:flex;align-items:center;gap:10px;width:100%;padding:4px 2px 10px;text-align:left;}
  .cat-chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s;}
  .cat.closed .cat-chev{transform:rotate(-90deg);}
  .cat-pill{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);}
  .cat-pill .ic{width:17px;height:17px;}
  .cat-name{font:600 18px/1 var(--serif);letter-spacing:-.01em;}
  .cat-count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .cat-dots{display:flex;gap:4px;margin-left:auto;}
  .cat-dots i{width:8px;height:8px;border-radius:50%;}
  .cat-dots .o{background:var(--red);}
  .cat-dots .l{background:color-mix(in srgb,var(--c) 55%,var(--surface));outline:1.5px solid color-mix(in srgb,var(--c) 75%,var(--ink));}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .cat.closed .card{display:none;}
  .cat .card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:none;border:0;box-shadow:none;border-radius:0;overflow:visible;}
  @media(min-width:600px){.cat .card{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}}
  .row{position:relative;display:flex;flex-direction:column;gap:9px;padding:12px 12px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0;}
  .row.out{border-color:color-mix(in srgb,var(--red) 38%,var(--line));}
  .row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .flags{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;}
  .ava{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 82%,var(--ink));}
  .ava .ic{width:24px;height:24px;}
  .row.out .ava{background:var(--red-soft);color:var(--red);}
  .info{display:block;text-align:left;min-width:0;width:100%;}
  .nm{display:block;font-weight:600;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;}
  .row .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em;white-space:normal;}
  .crow .nm{white-space:nowrap;}
  .sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink-3);margin-top:3px;}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px;line-height:1.5;white-space:nowrap;}
  .tag .ic{width:12px;height:12px;stroke-width:2.2;}
  .tag.out{background:var(--red);color:#fff;}
  .tag.low{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);}
  .tag.exp{background:var(--amber-soft);color:var(--amber);}
  .tag.exp.bad{background:var(--red-soft);color:var(--red);}
  .step{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;}
  .step button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:0 1px 1px rgba(0,0,0,.05);flex:none;}
  .step button:active{transform:scale(.92);}
  .step button[disabled]{opacity:.3;pointer-events:none;}
  .step .ic{width:18px;height:18px;stroke-width:2.2;}
  .q{flex:1;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05;}
  .q b{font-size:17px;font-weight:700;display:block;}
  .q small{font-size:11px;color:var(--ink-3);}
  .row.out .q b{color:var(--red);}
  .bar{height:4px;margin:3px -12px 0;background:var(--surface-2);}
  .bar i{display:block;height:100%;background:var(--c);border-radius:0 4px 4px 0;transition:width .3s;}
  .row.low .bar i{background:color-mix(in srgb,var(--c) 50%,var(--surface));}
  .row.out .bar i{background:var(--red);}

  /* ---------- Compra ---------- */
  .addline{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:6px;color:var(--ink-3);}
  .addline:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);}
  .addline input{flex:1;border:0;background:none;outline:0;height:40px;color:var(--ink);min-width:0;}
  .grp{margin-top:20px;}
  .grp-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;}
  .grp-head i{width:10px;height:10px;border-radius:50%;}
  .grp-head em{font-style:normal;color:var(--ink-3);font-weight:600;}
  .grp.out .grp-head{color:var(--red);} .grp.out .grp-head i{background:var(--red);}
  .grp.low .grp-head{color:var(--amber);} .grp.low .grp-head i{background:var(--amber);}
  .grp.forz .grp-head{color:var(--brand);} .grp.forz .grp-head i{background:var(--brand);}
  .grp.ext .grp-head{color:var(--ink-2);} .grp.ext .grp-head i{background:var(--ink-3);}
  .crow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:12px 14px;}
  .crow + .crow{border-top:1px solid var(--line);}
  .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:all .15s;}
  .chk .ic{width:17px;height:17px;stroke-width:3;}
  .crow.done .chk{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);}
  .crow.done .nm{text-decoration:line-through;color:var(--ink-3);}
  .crow .step{justify-content:flex-start;}
  .crow .step button{width:34px;height:34px;}
  .crow .q{flex:none;}
  .crow .rm{width:34px;height:34px;color:var(--ink-3);display:grid;place-items:center;}
  .cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));z-index:29;}
  .cartbar .btn{width:100%;min-height:54px;box-shadow:0 10px 30px color-mix(in srgb,var(--brand) 40%,transparent);font-size:16px;}

  /* ---------- Navegación y FAB ---------- */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));
    display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 40px rgba(20,30,24,.16);padding:6px;z-index:30;}
  .tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:18px;color:var(--ink-3);font-size:11.5px;font-weight:700;}
  .tabs button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);}
  .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--surface);}
  .fab{position:fixed;z-index:28;right:max(16px,calc(50% - 344px));bottom:calc(92px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;height:56px;padding:0 22px 0 18px;
    border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;box-shadow:0 12px 30px color-mix(in srgb,var(--brand) 42%,transparent);}
  .fab:active{transform:scale(.96);}
  .fab .ic{stroke-width:2.4;}

  /* ---------- Hojas (sheets) ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,24,18,.5);backdrop-filter:blur(3px);animation:fadeIn .18s;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{position:relative;width:min(560px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:720px){.sheet-bg{align-items:center;padding:20px}.sheet{border-radius:28px;}}
  .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h2{font:600 24px/1.1 var(--serif);letter-spacing:-.01em;}
  .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);}
  label.f{display:block;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--ink-2);}
  label.f > span{display:block;margin-bottom:6px;}
  .in{width:100%;height:50px;padding:0 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);outline:0;font-size:16px;color:var(--ink);}
  .in:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hint{font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:6px;display:block;}
  .sug{display:flex;flex-direction:column;gap:6px;margin:-6px 0 14px;}
  .sug button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:var(--surface-2);text-align:left;border:1px solid var(--line);}
  .sug .ava{width:36px;height:36px;border-radius:12px;} .sug .ava .ic{width:19px;height:19px;}
  .sug b{display:block;font-size:15px;} .sug small{color:var(--ink-3);font-size:12.5px;}
  .catchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .catchips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--ink-2);}
  .catchips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
  .nstep{display:flex;align-items:center;gap:6px;}
  .nstep .in{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px;}
  .nstep button{flex:none;width:46px;height:50px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:16px;font-weight:600;font-size:15px;color:var(--ink);}
  .switch small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px;}
  .switch input{appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;cursor:pointer;}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
  .switch input:checked{background:var(--brand);} .switch input:checked::after{transform:translateX(20px);}
  .acts{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;} .acts .btn{flex:1;min-width:140px;}
  .brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
  .brow + .brow{border-top:1px solid var(--line);}
  .brow .l{display:flex;align-items:center;gap:12px;min-width:0;font-weight:600;}
  .bcat{font:600 15px var(--serif);margin:16px 0 2px;display:flex;align-items:center;gap:8px;}
  .menu{display:flex;flex-direction:column;gap:8px;}
  .menu button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;text-align:left;}
  .menu button small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;}
  .menu .ic{color:var(--brand);}

  /* ---------- Ajustes ---------- */
  .set{margin-top:16px;} .set h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 8px;}
  .set .card{padding:4px 0;}
  .srow{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;}
  .srow + .srow{border-top:1px solid var(--line);}
  .srow .ic{color:var(--brand);}
  .srow .t{flex:1;min-width:0;font-weight:600;} .srow .t small{display:block;font-weight:400;color:var(--ink-3);font-size:13px;margin-top:2px;}

/* ---------------- sincronización (Firestore) ---------------- */
const DB = {
  fs: null, db: null, ref: null, unsub: null, ok: false, p: null, lastJSON: '',
  load(){
    if (this.p) return this.p;
    this.p = (async () => {
      try {
        const [{ initializeApp }, fs] = await Promise.all([
          import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
          import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)
        ]);
        const app = initializeApp(FIREBASE_CONFIG);
        let db;
        try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
        catch { db = fs.getFirestore(app); }
        this.fs = fs; this.db = db; this.ok = true;
      } catch (e) { console.warn('Firebase no disponible', e); this.ok = false; }
      return this.ok;
    })();
    return this.p;
  },
  async connect(code){
    this.disconnect();
    if (!(await this.load())) { setSync('local'); return false; }
    this.ref = this.fs.doc(this.db, COL, code);
    this.lastJSON = '';
    this.unsub = this.fs.onSnapshot(this.ref, { includeMetadataChanges: true }, onRemote, e => { console.warn('Sync', e); setSync('err'); });
    return true;
  },
  disconnect(){ if (this.unsub) { this.unsub(); this.unsub = null; } this.ref = null; },
  async create(code, nombre){
    if (!(await this.load())) throw Object.assign(new Error('sdk'), { code: 'sdk' });
    await this.fs.setDoc(this.fs.doc(this.db, COL, code), { v: 2, meta: { nombre, creado: Date.now() }, items: {}, extras: {}, hist: [] });
  },
  async exists(code){
    if (!(await this.load())) throw Object.assign(new Error('sdk'), { code: 'sdk' });
    const snap = await this.fs.getDoc(this.fs.doc(this.db, COL, code));
    return snap.exists();
  }
};

function setSync(s){ if (S.sync !== s) { S.sync = s; renderTop(); } }

function onRemote(snap){
  const md = snap.metadata || {};
  if (!snap.exists()) { if (!md.fromCache) { toast('Esta despensa ya no existe en la nube'); setSync('err'); } return; }
  const raw = snap.data();
  if (raw.v !== 2) { migrarV1(raw); return; }
  const json = JSON.stringify(raw);
  setSync(md.hasPendingWrites ? 'sync' : md.fromCache ? 'off' : 'ok');
  if (json === DB.lastJSON) return;
  DB.lastJSON = json;
  S.data = normalizeDoc(raw);
  if (raw.meta && raw.meta.nombre && raw.meta.nombre !== S.hogar.nombre) { S.hogar.nombre = raw.meta.nombre; ls.set('alacena:hogar', S.hogar); }
  ls.set('alacena:cache:' + S.hogar.code, S.data);
  renderApp();
}

// La versión anterior guardaba una lista (productos[]) en un único documento; la convertimos sin perder nada.
function migrarV1(raw){
  const items = {};
  (raw.productos || []).forEach(p => { const id = p.id || uid(); items[id] = cleanItem({ ...p, id }); });
  const upd = { v: 2, items, extras: {}, hist: [], meta: { nombre: S.hogar.nombre || 'Mi casa' } };
  S.data = normalizeDoc(upd);
  ls.set('alacena:cache:' + S.hogar.code, S.data);
  if (DB.ok && DB.ref) DB.fs.updateDoc(DB.ref, clone(upd)).then(() => setSync('ok')).catch(e => console.warn('Migración', e));
  renderApp();
  toast(`Despensa anterior recuperada: ${Object.keys(items).length} productos`);
}

// Todas las escrituras pasan por aquí: se aplican al instante en local y se envían a Firestore campo a campo
// (así dos personas editando a la vez no se pisan los cambios).
const DELETE = { del: true };
function applyLocal(o){
  const ks = o.path.split('.'); let t = S.data;
  for (let i = 0; i < ks.length - 1; i++) { t[ks[i]] = t[ks[i]] ?? {}; t = t[ks[i]]; }
  const last = ks[ks.length - 1];
  if (o.t === 'del') delete t[last];
  else if (o.t === 'inc') t[last] = Math.max(0, Math.round(((t[last] || 0) + o.v) * 100) / 100);
  else t[last] = clone(o.v);
}
function mutate(ops){
  ops.forEach(applyLocal);
  ls.set('alacena:cache:' + S.hogar.code, S.data);
  renderApp();
  if (S.hogar.local) return;
  if (DB.ok && DB.ref) {
    const upd = {};
    ops.forEach(o => { upd[o.path] = o.t === 'del' ? DB.fs.deleteField() : o.t === 'inc' ? DB.fs.increment(o.v) : clone(o.v); });
    setSync('sync');
    DB.fs.updateDoc(DB.ref, upd).then(() => { if (S.sync === 'sync') setSync(navigator.onLine ? 'ok' : 'off'); }).catch(e => { console.warn('Guardado', e); setSync('err'); toast('No se pudo guardar en la nube. Los cambios siguen en este dispositivo.'); });
  } else setSync('local');
}

function rowHTML(p){
  const e = estado(p), c = catColor(p.categoria), d = diasCad(p), st = paso(p);
  const pct = Math.max(0, Math.min(100, p.cantidad / objetivo(p) * 100));
  let flags = '';
  if (e === 'out') flags += `<span class="tag out">Agotado</span>`;
  else if (e === 'low') flags += `<span class="tag low">Poco</span>`;
  if (d !== null && d <= 3) flags += `<span class="tag exp ${d < 0 ? 'bad' : ''}">${ic('cal')}${d < 0 ? 'Caducado' : d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : d + ' días'}</span>`;
  const sub = p.avisar !== false ? `mín. ${fmt(p.minimo)} ${esc(p.unidad)}` : 'sin aviso';
  return `<div class="row ${e}" style="--c:${c}">
    <div class="row-top"><button class="ava" data-a="edit" data-id="${p.id}" aria-label="Editar ${esc(p.nombre)}" tabindex="-1">${ic(prodIcon(p))}</button><div class="flags">${flags}</div></div>
    <button class="info" data-a="edit" data-id="${p.id}" aria-label="Editar ${esc(p.nombre)}"><span class="nm">${esc(p.nombre)}</span><span class="sub">${sub}</span></button>
    <div class="step">
      <button data-a="dec" data-id="${p.id}" ${p.cantidad <= 0 ? 'disabled' : ''} aria-label="Quitar ${fmt(st)} ${esc(p.unidad)} de ${esc(p.nombre)}">${ic('minus')}</button>
      <div class="q" aria-live="polite"><b>${fmt(p.cantidad)}</b><small>${esc(p.unidad)}</small></div>
      <button data-a="inc" data-id="${p.id}" aria-label="Añadir ${fmt(st)} ${esc(p.unidad)} de ${esc(p.nombre)}">${ic('plus')}</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function emptyHTML(titulo, texto, acts = ''){ return `<div class="empty">${shelfSVG()}<h3>${esc(titulo)}</h3><p>${esc(texto)}</p>${acts}</div>`; }
function renderDespensa(){
  const all = lista();
  const n = { todo: all.length, agotado: all.filter(p => estado(p) === 'out').length, poco: all.filter(p => estado(p) === 'low').length, caduca: all.filter(caduca).length };
  if (S.filtro !== 'todo' && n[S.filtro] === 0) S.filtro = 'todo';
  const rep = n.agotado + n.poco;
  let ban = '';
  if (all.length) {
    ban = rep > 0
      ? `<div class="banner warn"><div class="lead">${ic('cart')}<div><b>${rep} ${rep === 1 ? 'producto por reponer' : 'productos por reponer'}</b><span>${n.agotado ? n.agotado + ' agotado' + (n.agotado > 1 ? 's' : '') : ''}${n.agotado && n.poco ? ' · ' : ''}${n.poco ? n.poco + ' con poco stock' : ''}</span></div></div><button class="btn sm" data-a="tab" data-t="compra">Ver lista</button></div>`
      : `<div class="banner good"><div class="lead">${ic('check')}<div><b>Todo en orden</b><span>Tu despensa está al día.</span></div></div></div>`;
    if (S.installEvt && !ls.get('alacena:instalar-no')) ban += `<div class="banner good"><div class="lead">${ic('phone')}<div><b>Instala Despentsa</b><span>Ábrela como una app, sin navegador.</span></div></div><span><button class="btn sm" data-a="install">Instalar</button></span></div>`;
  }
  $('#d-banner').innerHTML = ban;
  $('#d-chips').innerHTML = all.length ? [['todo', 'Todo', ''], ['agotado', 'Agotados', 'out'], ['poco', 'Poco', 'low'], ['caduca', 'Caducan', '']]
    .filter(([k]) => k === 'todo' || n[k] > 0).map(([k, l, c]) => `<button class="chip ${c}" data-a="filtro" data-f="${k}" aria-pressed="${S.filtro === k}">${l}<em>${n[k]}</em></button>`).join('') : '';
  const box = $('#d-list');
  if (!all.length) {
    box.innerHTML = emptyHTML('Tu despensa está vacía', 'Añade lo que tienes en casa y Despentsa te avisará cuando algo se acabe.',
      `<div class="acts"><button class="btn" data-a="basicos">${ic('sparkle')} Empezar con básicos</button><button class="btn ghost" data-a="add">${ic('plus')} Añadir un producto</button></div>`);
    return;
  }
  const q = norm(S.q);
  let vis = all.filter(p => (!q || norm(p.nombre).includes(q)) && (S.filtro === 'todo' || (S.filtro === 'agotado' && estado(p) === 'out') || (S.filtro === 'poco' && estado(p) === 'low') || (S.filtro === 'caduca' && caduca(p))));
  if (!vis.length) { box.innerHTML = emptyHTML('Nada por aquí', q ? `No encuentro «${S.q}» en tu despensa.` : 'No hay productos con este filtro.', q ? `<div class="acts"><button class="btn" data-a="add-q">${ic('plus')} Añadir «${esc(S.q)}»</button></div>` : ''); return; }
  const by = {};
  vis.forEach(p => { const c = (p.categoria || 'Otros').trim() || 'Otros'; (by[c] = by[c] || []).push(p); });
  const forzar = S.filtro !== 'todo' || !!q;
  box.innerHTML = Object.keys(by).sort((a, b) => catRank(a) - catRank(b) || a.localeCompare(b, 'es')).map(cat => {
    const its = by[cat], c = catColor(cat), closed = !forzar && S.colapsadas.has(cat);
    const o = its.filter(p => estado(p) === 'out').length, l = its.filter(p => estado(p) === 'low').length;
    return `<section class="cat ${closed ? 'closed' : ''}" style="--c:${c}">
      <button class="cat-head" data-a="cat" data-c="${esc(cat)}" aria-expanded="${!closed}">
        <span class="cat-chev">${ic('chev')}</span><span class="cat-pill">${ic(catIcon(cat))}</span>
        <span class="cat-name">${esc(cat)}</span><span class="cat-count">${its.length}</span>
        <span class="cat-dots">${o ? '<i class="o" title="Agotados"></i>' : ''}${l ? '<i class="l" title="Poco stock"></i>' : ''}</span></button>
      <div class="card">${its.map(rowHTML).join('')}</div></section>`;
  }).join('');
}

    <div id="c-list"></div></section>`;

function filaCompra(p){
  const st = paso(p), c = catColor(p.categoria);
  return `<div class="crow ${p.chk ? 'done' : ''}" style="--c:${c}">
    <button class="chk" data-a="chk" data-id="${p.id}" role="checkbox" aria-checked="${!!p.chk}" aria-label="Marcar ${esc(p.nombre)} como comprado">${ic('check')}</button>
    <div class="info"><span class="nm">${esc(p.nombre)}</span><span class="sub"><span>Tienes ${fmt(p.cantidad)} ${esc(p.unidad)}${p.avisar !== false ? ' · mín. ' + fmt(p.minimo) : ''}</span></span></div>
    <div class="step"><button data-a="bdec" data-id="${p.id}" aria-label="Comprar menos">${ic('minus')}</button><div class="q"><b>${fmt(comprar(p))}</b><small>${esc(p.unidad)}</small></div><button data-a="binc" data-id="${p.id}" aria-label="Comprar más">${ic('plus')}</button></div></div>`;
}
function filaExtra(x){
  return `<div class="crow ${x.ok ? 'done' : ''}">
    <button class="chk" data-a="chkx" data-id="${x.id}" role="checkbox" aria-checked="${!!x.ok}" aria-label="Marcar ${esc(x.nombre)} como comprado">${ic('check')}</button>
    <div class="info"><span class="nm">${esc(x.nombre)}</span></div>
    <button class="rm" data-a="delx" data-id="${x.id}" aria-label="Quitar ${esc(x.nombre)} de la lista">${ic('close')}</button></div>`;
}
function renderCompra(){
  const g = grupos(), total = g.out.length + g.low.length + g.forz.length + g.extras.length;
  const h = S.data.hist[0];
  $('#c-sub').textContent = h ? `Última compra: ${haceCuanto(h.t)} · ${h.n} ${h.n === 1 ? 'producto' : 'productos'}` : (total ? `${total} ${total === 1 ? 'artículo' : 'artículos'}` : '');
  $('#dl-prod').innerHTML = lista().map(p => `<option value="${esc(p.nombre)}">`).join('');
  const box = $('#c-list');
  if (!total) { box.innerHTML = emptyHTML('Lista vacía', 'Cuando algo se agote o baje del mínimo aparecerá aquí solo. También puedes añadir lo que quieras arriba.'); return; }
  const grp = (cls, titulo, rows) => rows.length ? `<section class="grp ${cls}"><div class="grp-head"><i></i>${titulo}<em>${rows.length}</em></div><div class="card">${rows.join('')}</div></section>` : '';
  box.innerHTML = grp('out', 'Agotados', g.out.map(filaCompra)) + grp('low', 'Bajo mínimo', g.low.map(filaCompra)) + grp('forz', 'Añadidos por ti', g.forz.map(filaCompra)) + grp('ext', 'Otros', g.extras.map(filaExtra));
}
function haceCuanto(t){
  const d = Math.floor((Date.now() - t) / 86400000);
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : d < 30 ? `hace ${d} días` : `hace ${Math.floor(d / 30)} ${Math.floor(d / 30) === 1 ? 'mes' : 'meses'}`;
}
function marcados(){ const g = grupos(); return { its: [...g.out, ...g.low, ...g.forz].filter(p => p.chk), ex: g.extras.filter(x => x.ok) }; }
function renderCartbar(){
  const el = $('#cartbar'), m = marcados(), n = m.its.length + m.ex.length;
  el.hidden = !(S.tab === 'compra' && n > 0);
  if (!el.hidden) el.innerHTML = `<button class="btn" data-a="finalizar">${ic('check')} Finalizar compra · ${n}</button>`;
}

/* ---------------- hoja: producto ---------------- */
function cuerpoProducto(d, editId){
  const cats = [...new Set([...CATS_RAPIDAS, ...lista().map(p => p.categoria)])];
  return `<form id="pf" autocomplete="off" novalidate data-id="${editId || ''}">
    <label class="f"><span>Producto</span><input class="in" name="nombre" value="${esc(d.nombre)}" placeholder="Ej. Leche, lentejas, detergente…" data-i="fnombre" required enterkeyhint="next"></label>
    <div class="sug" id="sug"></div>
    <label class="f"><span>Categoría</span><div class="catchips" id="catchips">${cats.map(c => `<button type="button" data-a="fcat" data-v="${esc(c)}" aria-pressed="${norm(c) === norm(d.categoria)}">${esc(c)}</button>`).join('')}</div>
      <input class="in" name="categoria" value="${esc(d.categoria)}" placeholder="O escribe una nueva" data-i="fcat"></label>
    <div class="g2">
      <label class="f"><span>Cantidad</span><div class="nstep"><button type="button" data-a="fstep" data-f="cantidad" data-d="-1" aria-label="Menos">${ic('minus')}</button><input class="in" name="cantidad" type="number" inputmode="decimal" step="any" min="0" value="${d.cantidad}"><button type="button" data-a="fstep" data-f="cantidad" data-d="1" aria-label="Más">${ic('plus')}</button></div></label>
      <label class="f"><span>Unidad</span><input class="in" name="unidad" value="${esc(d.unidad)}" list="dl-uni"><datalist id="dl-uni">${UNIDADES.map(u => `<option value="${u}">`).join('')}</datalist></label>
    </div>
    <div class="g2">
      <label class="f"><span>Avisarme al llegar a</span><input class="in" name="minimo" type="number" inputmode="decimal" step="any" min="0" value="${d.minimo}"></label>
      <label class="f"><span>Quiero tener</span><input class="in" name="objetivo" type="number" inputmode="decimal" step="any" min="0" value="${d.objetivo || ''}" placeholder="Auto"></label>
    </div>
    <label class="f"><span>Caduca el (opcional)</span><input class="in" name="caduca" type="date" value="${esc(d.caduca || '')}"></label>
    <label class="switch"><span>Avisarme cuando falte<small>Si lo apagas, no entrará solo en la lista de la compra</small></span><input type="checkbox" name="avisar" ${d.avisar !== false ? 'checked' : ''}></label>
    <div class="acts">
      ${editId ? `<button type="button" class="btn danger" data-a="fdel">${ic('trash')} Eliminar</button>` : `<button type="submit" class="btn ghost" data-more="1">Guardar y añadir otro</button>`}
      <button type="submit" class="btn">${editId ? 'Guardar cambios' : 'Añadir'}</button>
    </div></form>`;
}
function openProducto(id, pre = {}){
  const p = id ? S.data.items[id] : null;
  if (id && !p) return;
  const d = p ? { ...p } : { nombre: pre.nombre || '', categoria: pre.categoria || '', unidad: pre.unidad || 'uds', cantidad: pre.cantidad ?? 1, minimo: pre.minimo ?? 1, objetivo: pre.objetivo || 0, caduca: '', avisar: true };
  openSheet(sheetHead(p ? 'Editar producto' : 'Nuevo producto') + cuerpoProducto(d, id), () => {
    const f = $('#pf'); if (!id) { f.elements.nombre.focus(); if (d.nombre) renderSug(d.nombre); }
  });
}
function renderSug(txt){
  const box = $('#sug'); if (!box) return;
  const q = norm(txt); if (!q || $('#pf').dataset.id) { box.innerHTML = ''; return; }
  const have = lista().filter(p => norm(p.nombre).includes(q)).slice(0, 3);
  const names = new Set(lista().map(p => norm(p.nombre)));
  const cat = CATALOGO.filter(c => norm(c[0]).includes(q) && !names.has(norm(c[0]))).slice(0, 4 - have.length + 1);
  box.innerHTML = have.map(p => `<button type="button" data-a="fsug" data-k="have" data-id="${p.id}"><span class="ava" style="--c:${catColor(p.categoria)}">${ic(prodIcon(p))}</span><span><b>${esc(p.nombre)}</b><small>Ya en tu despensa · ${fmt(p.cantidad)} ${esc(p.unidad)} · toca para editar</small></span></button>`).join('') +
    cat.map(c => { const it = catalogoItem(c); return `<button type="button" data-a="fsug" data-k="cat" data-n="${esc(c[0])}"><span class="ava" style="--c:${catColor(it.categoria)}">${ic(prodIcon(it))}</span><span><b>${esc(it.nombre)}</b><small>${esc(it.categoria)} · ${esc(it.unidad)}</small></span></button>`; }).join('');
}
function guardarProducto(otro){
  const f = $('#pf'), g = n => f.elements[n], editId = f.dataset.id;
  const nombre = g('nombre').value.trim();
  if (!nombre) { g('nombre').focus(); g('nombre').style.borderColor = 'var(--red)'; return; }
  const num = (n, d = 0) => { const v = parseFloat(String(g(n).value).replace(',', '.')); return isNaN(v) ? d : Math.max(0, v); };
  const nuevo = { nombre, categoria: g('categoria').value.trim() || 'Otros', unidad: g('unidad').value.trim() || 'uds', cantidad: num('cantidad'), minimo: num('minimo'), objetivo: num('objetivo'), caduca: g('caduca').value || '', avisar: g('avisar').checked };
  if (editId) {
    const prev = S.data.items[editId], ops = [];
    Object.keys(nuevo).forEach(k => { if (prev[k] !== nuevo[k]) ops.push({ t: 'set', path: `items.${editId}.${k}`, v: nuevo[k] }); });
    if (ops.length) { if (nuevo.cantidad > 0 && nuevo.cantidad > nuevo.minimo) ops.push({ t: 'set', path: `items.${editId}.lista`, v: prev.lista }); mutate(ops); }
    closeSheet(); toast('Cambios guardados'); return;
  }
  const dup = lista().find(x => norm(x.nombre) === norm(nombre));
  if (dup) { mutate([{ t: 'inc', path: `items.${dup.id}.cantidad`, v: nuevo.cantidad }]); toast(`Ya tenías «${dup.nombre}»: sumadas ${fmt(nuevo.cantidad)} ${dup.unidad}`); }
  else { const id = uid(); mutate([{ t: 'set', path: `items.${id}`, v: { id, ...nuevo, lista: false, chk: false } }]); toast(`Añadido: ${nombre}`); }
  if (otro) { openProducto(null, { categoria: nuevo.categoria }); } else closeSheet();
}

/* ---------------- hoja: básicos ---------------- */
function openBasicos(){
  S.bas = {};
  const have = new Set(lista().map(p => norm(p.nombre)));
  const disp = CATALOGO.filter(c => !have.has(norm(c[0])));
  const by = {}; disp.forEach(c => (by[c[1]] = by[c[1]] || []).push(c));
  const html = sheetHead('Empieza con lo básico') + `<p class="hint" style="margin:-6px 0 6px">Toca <b>+</b> en lo que tienes en casa y ajusta cuánto. Luego puedes cambiar lo que quieras.</p>` +
    Object.keys(by).sort((a, b) => catRank(a) - catRank(b)).map(cat => `<div class="bcat" style="color:color-mix(in srgb,${catColor(cat)} 78%,var(--ink))">${ic(catIcon(cat), '')}${esc(cat)}</div>` +
      by[cat].map(c => { const it = catalogoItem(c); return `<div class="brow" data-n="${esc(c[0])}"><span class="l"><span class="ava" style="--c:${catColor(cat)};width:38px;height:38px;border-radius:12px">${ic(prodIcon(it))}</span>${esc(c[0])}</span>
        <div class="step"><button type="button" data-a="bstep" data-n="${esc(c[0])}" data-d="-1" aria-label="Menos">${ic('minus')}</button><div class="q"><b data-q>0</b><small>${esc(c[2])}</small></div><button type="button" data-a="bstep" data-n="${esc(c[0])}" data-d="1" aria-label="Más">${ic('plus')}</button></div></div>`; }).join('')).join('') +
    `<div class="acts" style="position:sticky;bottom:-22px;background:var(--surface);padding:14px 0 4px;margin-top:10px"><button class="btn" id="bok" data-a="bok" disabled style="width:100%">Añadir productos</button></div>`;
  openSheet(html);
}
function bstep(n, d){
  const c = CATALOGO.find(x => x[0] === n); if (!c) return;
  let q = S.bas[n] || 0;
  if (q === 0 && d > 0) q = Math.max(c[3] + paso({ unidad: c[2] }), paso({ unidad: c[2] })); else q = Math.max(0, q + d * paso({ unidad: c[2] }));
  S.bas[n] = q;
  const row = [...document.querySelectorAll('.brow')].find(r => r.dataset.n === n);
  if (row) row.querySelector('[data-q]').textContent = fmt(q);
  const tot = Object.values(S.bas).filter(v => v > 0).length, b = $('#bok');
  b.disabled = tot === 0; b.textContent = tot ? `Añadir ${tot} ${tot === 1 ? 'producto' : 'productos'}` : 'Añadir productos';
}
function bok(){
  const ops = []; let n = 0;
  Object.entries(S.bas).forEach(([nom, q]) => {
    if (q <= 0) return; const c = CATALOGO.find(x => x[0] === nom); if (!c) return;
    const id = uid() + n; n++;
    ops.push({ t: 'set', path: `items.${id}`, v: { id, nombre: c[0], categoria: c[1], unidad: c[2], cantidad: q, minimo: c[3], objetivo: c[4], caduca: '', avisar: true, lista: false, chk: false } });
  });
  if (ops.length) mutate(ops);
  closeSheet(); toast(`${n} productos añadidos`);
}

/* ---------------- compra: acciones ---------------- */
function finalizar(){
  const m = marcados(); if (!m.its.length && !m.ex.length) { toast('Marca primero lo que has comprado'); return; }
  const prev = { items: {}, extras: {}, hist: clone(S.data.hist) }, ops = [], now = Date.now();
  m.its.forEach(p => {
    prev.items[p.id] = clone(p);
    ops.push({ t: 'inc', path: `items.${p.id}.cantidad`, v: comprar(p) }, { t: 'set', path: `items.${p.id}.chk`, v: false }, { t: 'set', path: `items.${p.id}.lista`, v: false }, { t: 'set', path: `items.${p.id}.buy`, v: 0 });
  });
  m.ex.forEach(x => { prev.extras[x.id] = clone(x); ops.push({ t: 'del', path: `extras.${x.id}` }); });
  const n = m.its.length + m.ex.length;
  ops.push({ t: 'set', path: 'hist', v: [{ t: now, n }, ...S.data.hist].slice(0, 12) });
  mutate(ops);
  toast(`Compra guardada · ${m.its.length} ${m.its.length === 1 ? 'producto repuesto' : 'productos repuestos'}`, 'Deshacer', () => {
    const undo = [];
    Object.entries(prev.items).forEach(([id, p]) => undo.push({ t: 'set', path: `items.${id}`, v: p }));
    Object.entries(prev.extras).forEach(([id, x]) => undo.push({ t: 'set', path: `extras.${id}`, v: x }));
    undo.push({ t: 'set', path: 'hist', v: prev.hist });
    mutate(undo);
  }, 9000);
}
function textoLista(){
  const g = grupos(), linea = p => `• ${p.nombre} — ${fmt(comprar(p))} ${p.unidad}`;
  let t = `🛒 Lista de la compra · ${S.hogar.nombre}\n`;
  if (g.out.length) t += `\nAgotados\n${g.out.map(linea).join('\n')}\n`;
  if (g.low.length) t += `\nBajo mínimo\n${g.low.map(linea).join('\n')}\n`;
  if (g.forz.length) t += `\nAñadidos\n${g.forz.map(linea).join('\n')}\n`;
  if (g.extras.length) t += `\nOtros\n${g.extras.map(x => `• ${x.nombre}`).join('\n')}\n`;
  return t.trim() + '\n\nHecho con Despentsa';
}
function descargar(contenido, tipo, nombre){
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const hoy = () => new Date().toISOString().slice(0, 10);
const rtfEsc = s => [...String(s).replace(/[\\{}]/g, c => '\\' + c)].map(ch => { const k = ch.codePointAt(0); return k > 126 ? (k > 65535 ? '' : '\\u' + (k > 32767 ? k - 65536 : k) + '?') : ch; }).join('');
function exportarRTF(){
  const g = grupos();
  if (![...g.out, ...g.low, ...g.forz, ...g.extras].length) { toast('La lista está vacía'); return; }
  const bloque = (t, arr, f) => arr.length ? `{\\pard\\sb200\\b\\fs24 ${rtfEsc(t)}\\b0\\fs22\\par}\n` + arr.map(x => `{\\pard\\li360\\fi-240 \\bullet\\tab ${rtfEsc(f(x))}\\par}\n`).join('') : '';
  const f = p => `${p.nombre} — ${fmt(comprar(p))} ${p.unidad}`;
  const rtf = `{\\rtf1\\ansi\\ansicpg1252\\deff0\n{\\fonttbl{\\f0\\fswiss Calibri;}}\n\\f0\\fs22\n{\\pard\\fs36\\b ${rtfEsc('Lista de la compra')}\\b0\\par}\n{\\pard\\fs20\\i ${rtfEsc(S.hogar.nombre + ' · ' + new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }))}\\i0\\par}\n` +
    bloque('Agotados', g.out, f) + bloque('Bajo mínimo', g.low, f) + bloque('Añadidos', g.forz, f) + bloque('Otros', g.extras, x => x.nombre) + '}';
  descargar(rtf, 'application/rtf', `lista-compra-${hoy()}.rtf`);
}

  'export-json': () => descargar(JSON.stringify({ app: 'despentsa', v: 2, hogar: S.hogar.nombre, items: S.data.items, extras: S.data.extras }, null, 2), 'application/json', `despentsa-copia-${hoy()}.json`),

  fstep: el => { const i = $('#pf').elements[el.dataset.f]; const v = parseFloat(String(i.value).replace(',', '.')) || 0; i.value = Math.max(0, Math.round((v + Number(el.dataset.d)) * 100) / 100); },

function copiar(txt, msg){
  const ok = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => prompt('Copia esto:', txt));
  else prompt('Copia esto:', txt);
}

document.addEventListener('submit', async e => {
  const id = e.target.id; if (!id) return; e.preventDefault();
  if (id === 'pf') guardarProducto(e.submitter && e.submitter.dataset.more === '1');
  if (id === 'nf') { const n = e.target.elements.n.value.trim(); if (n) { S.hogar.nombre = n; ls.set('alacena:hogar', S.hogar); if (!S.hogar.local) mutate([{ t: 'set', path: 'meta.nombre', v: n }]); else renderApp(); } closeSheet(); }
  if (id === 'c-form') {

    else { const xid = uid(); mutate([{ t: 'set', path: `extras.${xid}`, v: { id: xid, nombre: v, ok: false } }]); }

document.addEventListener('change', async e => {
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  try {
    const raw = JSON.parse(await e.target.files[0].text());
    const src = Array.isArray(raw) ? { productos: raw } : raw;
    const items = {};
    if (src.items) Object.entries(src.items).forEach(([id, p]) => { items[id] = cleanItem({ ...p, id }); });
    else (src.productos || []).forEach(p => { const id = p.id || uid(); items[id] = cleanItem({ ...p, id }); });
    const n = Object.keys(items).length; if (!n) throw new Error('vacío');
    openSheet(sheetHead('Restaurar copia') + `<p style="color:var(--ink-2);margin-bottom:18px">Se sustituirán los productos actuales por los <b>${n}</b> de la copia.</p><div class="acts"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn" id="imp-ok">Restaurar</button></div>`, () => {
      $('#imp-ok').onclick = () => { closeSheet(); mutate([{ t: 'set', path: 'items', v: items }, { t: 'set', path: 'extras', v: src.extras || {} }]); toast('Copia restaurada'); };
    });
  } catch { toast('Ese archivo no parece una copia de Despentsa'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

      <button class="btn ghost lg" data-a="ob-copy">${ic('copy')} Copiar enlace de invitación</button>
      <button class="btn lg" data-a="ob-fin">Continuar</button>`;
  } else if (o.step === 'unirse') {
    h = `${back}<h2>Unirme a una despensa</h2><p class="lead">Escribe el código que te han compartido, o abre el enlace de invitación.</p>

      <button class="btn lg" type="submit" ${o.busy ? 'disabled' : ''}>${o.busy ? 'Buscando…' : 'Unirme'}</button></form>

async function crearHogar(){
  const nombre = (S.ob.nombre || 'Mi casa').trim() || 'Mi casa', code = genCode();
  S.ob = { step: 'crear', nombre, busy: true }; renderApp();
  try {
    await Promise.race([DB.create(code, nombre), new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('t'), { code: 'unavailable' })), 9000))]);
    S.ob = { step: 'codigo', h: { code, nombre } };
    setHogar(S.ob.h); ls.set('alacena:cache:' + code, { items: {}, extras: {}, hist: [], meta: { nombre } });
    S.hogar = null; ls.del('alacena:hogar'); // se fija definitivamente al pulsar «Continuar»
    renderApp();
  } catch (e) { console.warn(e); S.ob = { step: 'crear', nombre, err: errMsg(e) }; renderApp(); }
}
async function unirse(code){
  if (!code) return;
  S.ob = { step: 'unirse', code, busy: true }; renderApp();
  try {
    if (!(await DB.exists(code))) { S.ob = { step: 'unirse', code: showCode(code), err: ['No encuentro esa despensa.', 'Revisa el código: tiene 10 letras y números.'] }; renderApp(); return; }
    await entrar({ code, nombre: code === LEGACY_CODE ? 'Mi casa' : 'Mi hogar' });
  } catch (e) { console.warn(e); S.ob = { step: 'unirse', code: showCode(code), err: errMsg(e) }; renderApp(); }
}

document.documentElement.dataset.theme = S.tema;

(function start(){
  const u = new URL(location.href), hp = new URLSearchParams(location.hash.slice(1));
  const join = normCode(hp.get('c') || u.searchParams.get('c'));
  const tab = u.searchParams.get('tab'), accion = u.searchParams.get('accion');
  if (['despensa', 'compra', 'ajustes'].includes(tab)) S.tab = tab;
  if (join || tab || accion) history.replaceState(null, '', location.pathname);
  if (S.hogar) {
    const cached = ls.get('alacena:cache:' + S.hogar.code);
    if (cached) S.data = normalizeDoc(cached);
    renderApp();
    if (S.hogar.local) setSync('local'); else DB.connect(S.hogar.code);
    if (join && join !== S.hogar.code) openSheet(sheetHead('Unirte a otra despensa') + `<p style="color:var(--ink-2);margin-bottom:18px">Has abierto una invitación (<b>${esc(showCode(join))}</b>). ¿Quieres cambiar a esa despensa?</p><div class="acts"><button class="btn ghost" data-a="close">No, quedarme</button><button class="btn" id="join-ok">Sí, unirme</button></div>`, () => { $('#join-ok').onclick = () => { closeSheet(); unirse(join); }; });
    else if (accion === 'anadir') openProducto(null);
  } else {
    if (join) { S.ob = { step: 'unirse', code: showCode(join) }; renderApp(); unirse(join); }
    else renderApp();
  }
})();
